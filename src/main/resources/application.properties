spring.application.name=clinica

spring.config.import=optional:file:.env[.properties]

secret.api.key.clinica=${JWT_SECRET}
api.token.expiration-ms=3600000
api.token.expiration-in-days=15

spring.datasource.url=jdbc:mysql://localhost:3306/clinica?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:clinica}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=INFO